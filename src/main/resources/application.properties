spring.application.name=clubnauticovaldivia

# Conexion a la base en Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion del Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del backend
server.port=${PORT:8080}
server.address=0.0.0.0

# Configuracion de documentos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configuracion de Neon Object Storage
storage.endpoint=${AWS_ENDPOINT_URL_S3}
storage.access-key=${AWS_ACCESS_KEY_ID}
storage.secret-key=${AWS_SECRET_ACCESS_KEY}
storage.region=${AWS_REGION}
storage.bucket=${AWS_BUCKET}
